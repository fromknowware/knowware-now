name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Daily rebuild so stories with a future `added` date go live on their day.
  # 13:00 UTC is 07:00 in Denver. Nothing is published that was not already
  # committed to main; the build only releases entries whose date has arrived.
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract content collections
        run: npm run extract

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=knowware-book
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
