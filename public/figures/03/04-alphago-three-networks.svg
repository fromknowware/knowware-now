<svg xmlns="http://www.w3.org/2000/svg" viewBox="328 138 624 601" width="624" height="601"><title>AlphaGo three-network coordination</title><rect x="328" y="138" width="624" height="601" fill="#fff"/><defs><marker id="ap" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#1a5a32"/></marker></defs>

<!-- SELF-PLAY SIGNAL → VALUE NETWORK (horizontal) -->
<g><line x1="430" y1="383.7" x2="850" y2="383.7" stroke="#1a5a32" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#ap)"/><rect x="634" y="377.7" width="12" height="12" fill="#ebebeb"/><text x="640" y="384.7" text-anchor="middle" dominant-baseline="middle" fill="#1a5a32" font-family="monospace" font-size="11" font-weight="700">+</text></g>

<!-- TREE SEARCH → EMERGENT MOVE (horizontal) -->
<g><line x1="757" y1="670.5" x2="523" y2="670.5" stroke="#1a5a32" stroke-width="1.4" stroke-opacity="0.85" marker-end="url(#ap)"/><rect x="634" y="664.5" width="12" height="12" fill="#ebebeb"/><text x="640" y="671.5" text-anchor="middle" dominant-baseline="middle" fill="#1a5a32" font-family="monospace" font-size="11" font-weight="700">+</text></g>

<!-- POLICY NETWORK -->
<g transform="translate(640,206.5)"><circle r="40" fill="none" stroke="#0c3a6a" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="3 3"/><circle r="33" fill="#ebebeb" stroke="#0c3a6a" stroke-width="1.5"/><circle r="31" fill="#0c3a6a" fill-opacity="0.07"/><text x="0" y="-5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">POLICY</text><text x="0" y="5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">NETWORK</text></g>

<!-- VALUE NETWORK -->
<g transform="translate(883.9,383.7)"><circle r="40" fill="none" stroke="#0c3a6a" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="3 3"/><circle r="33" fill="#ebebeb" stroke="#0c3a6a" stroke-width="1.5"/><circle r="31" fill="#0c3a6a" fill-opacity="0.07"/><text x="0" y="-5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">VALUE</text><text x="0" y="5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">NETWORK</text></g>

<!-- TREE SEARCH -->
<g transform="translate(790.8,670.5)"><circle r="40" fill="none" stroke="#3a1a6a" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="3 3"/><circle r="33" fill="#ebebeb" stroke="#3a1a6a" stroke-width="1.5"/><circle r="31" fill="#3a1a6a" fill-opacity="0.07"/><text x="0" y="-5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">TREE</text><text x="0" y="5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">SEARCH</text></g>

<!-- EMERGENT MOVE -->
<g transform="translate(489.2,670.5)"><circle r="40" fill="none" stroke="#e8722a" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="3 3"/><circle r="33" fill="#ebebeb" stroke="#e8722a" stroke-width="1.5"/><circle r="31" fill="#e8722a" fill-opacity="0.07"/><text x="0" y="-5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">EMERGENT</text><text x="0" y="5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">MOVE</text><circle cx="26" cy="-26" r="8" fill="#7a1a1a"/><text x="26" y="-25" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="8" font-weight="700">✗</text></g>

<!-- SELF-PLAY SIGNAL -->
<g transform="translate(396.1,383.7)"><circle r="40" fill="none" stroke="#1a5a32" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="3 3"/><circle r="33" fill="#ebebeb" stroke="#1a5a32" stroke-width="1.5"/><circle r="31" fill="#1a5a32" fill-opacity="0.07"/><text x="0" y="-5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">SELF-PLAY</text><text x="0" y="5.5" text-anchor="middle" dominant-baseline="middle" fill="#0a0a0a" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">SIGNAL</text></g>

</svg>
