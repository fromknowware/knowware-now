<style>
  :root {
    --bg: #EDEEE4;
    --paper: #EDEEE4;
    --ink: #191938;
    --sub: #6b6b6b;
    --sub2: #9a9a97;
    --rule: rgba(25,25,56,.16);
    --rule-strong: #191938;
    --signal: #2F55E0;
    --accent: #2F55E0;
    --accent-soft: oklch(0.90 0.05 250);
    --theme-transition: background-color 0.7s cubic-bezier(0.19,1,0.22,1), color 0.7s cubic-bezier(0.19,1,0.22,1), border-color 0.7s cubic-bezier(0.19,1,0.22,1);

    /* Tweakable readability variables */
    --body-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --read-scale: 1.1;        /* multiplier on reading font sizes */
    --read-lh: 1.7;          /* line-height in reading article */
    --read-col: 880px;        /* max reading column width */
    --read-track: -0.015em;  /* letter-spacing for body */

    /* Three tiers — equal lightness & chroma, distinct hues */
    --tier-a:     oklch(0.88 0.09 260);  /* Academics — blue */
    --tier-p:     oklch(0.88 0.09 35);   /* Practitioners — terracotta */
    --tier-v:     oklch(0.88 0.09 140);  /* Visionaries — sage */
    --tier-a-ink: oklch(0.35 0.10 260);
    --tier-p-ink: oklch(0.40 0.12 35);
    --tier-v-ink: oklch(0.35 0.10 140);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern", "liga";
    overflow-x: hidden;
    transition: var(--theme-transition);
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  a { color: inherit; text-decoration: none; }

  /* Dark theme */
  html[data-theme="dark"] {
    --bg: #111110;
    --paper: #1a1a18;
    --ink: #f0f0ea;
    --sub: #8a8a84;
    --sub2: #555550;
    --rule: #2a2a27;
    --accent: oklch(0.65 0.15 250);
    --accent-soft: oklch(0.22 0.06 250);
  }

  /* Warm theme */
  html[data-theme="warm"] {
    --bg: #e8e5de;
    --paper: #eeebe3;
    --ink: #1a1814;
    --sub: #6b6458;
    --sub2: #9a9488;
    --rule: #cbc7bd;
    --accent: oklch(0.50 0.15 250);
    --accent-soft: oklch(0.92 0.04 250);
  }

  /* High-contrast mode — applied when data-contrast="high" */
  html[data-contrast="high"] {
    --bg: #ffffff;
    --paper: #ffffff;
    --ink: #000000;
    --sub: #3a3a3a;
    --sub2: #5a5a5a;
    --rule: #b8b8b8;
  }

  /* Dock bar — fixed bottom, slides up on scroll */
  #kw-dock {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: #191938; color: #EDEEE4;
    display: flex; align-items: center; gap: 16;
    padding: 0 24px; height: 48px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: -0.005em;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    border-top: 1px solid rgba(237,238,228,0.12);
  }
  #kw-dock.kw-visible { transform: translateY(0); }
  #kw-dock-cta {
    background: #2F55E0; color: #EDEEE4;
    padding: 8px 18px; border: none; cursor: pointer;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: -0.005em;
    text-decoration: none; display: inline-block;
    margin-left: auto; flex-shrink: 0;
  }
  #kw-dock-cta:hover { background: #1e3fc0; }
  #kw-dock-sep { color: rgba(237,238,228,0.25); }

  /* Reading article overrides — applied inside <article data-kw-read> */
  article[data-kw-read] p,
  article[data-kw-read] blockquote p {
    font-size: calc(17px * var(--read-scale));
    line-height: var(--read-lh);
    letter-spacing: var(--read-track);
  }
  article[data-kw-read] blockquote p {
    font-size: calc(22px * var(--read-scale));
  }
  article[data-kw-read] {
    max-width: var(--read-col);
  }

  /* ============================================================
     Field — the cover's bar-field, generative on the web
     ============================================================ */
  .kw-field {
    --field-h: 360px;
    --sig-top: 41%;
    position: relative;
    height: var(--field-h);
    overflow: hidden;
    background:
      repeating-linear-gradient(to bottom,
        transparent 0 72px,
        var(--paper)  72px  76px,
        var(--ink)    76px 104px,
        var(--paper) 104px 108px,
        transparent  108px 120px),
      repeating-linear-gradient(to bottom,
        var(--ink) 0 3px,
        transparent 3px 12px);
  }
  .kw-field-sig {
    position: absolute; left: 0; right: 0; top: var(--sig-top);
    height: 4px; background: var(--signal, #2F55E0);
    transform-origin: left center;
  }
  @media (prefers-reduced-motion: no-preference) {
    .kw-field-sig { animation: kw-sig 900ms cubic-bezier(.2,.7,.2,1) .35s both; }
    @keyframes kw-sig { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  }
  .kw-field--divider { --field-h: 72px; background-position: 0 -40px; }
  .kw-field--82 { --sig-top: calc(100% - 7px); --field-h: 300px; }
  .kw-field-caption {
    position: absolute; right: 0; bottom: -30px;
    font: 600 11px/1 "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--signal, #2F55E0);
  }

  /* Dot — the cover mark */
  .kw-dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink); margin-right: 10px; vertical-align: 1px;
  }

  /* Cover hero */
  .kw-hero-cover { border-bottom: 2px solid var(--ink); }
  .kw-hero-word {
    font: 800 clamp(64px, 15vw, 220px)/0.92 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: -.035em; color: var(--ink);
    text-transform: uppercase;
    margin: 0; padding: clamp(20px,3vw,36px) clamp(16px,3vw,48px) 0;
  }
  .kw-hero-foot {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 24px; flex-wrap: wrap;
    padding: clamp(20px,3vw,36px) clamp(16px,3vw,48px) clamp(40px,6vw,72px);
  }
  .kw-hero-tag {
    font: 400 clamp(15px,1.6vw,19px)/1.5 "JetBrains Mono", ui-monospace, monospace;
    color: var(--sub); margin: 0;
  }
  .kw-hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
</style>

<script>
(function () {
  var dock = document.getElementById('kw-dock');
  var cta  = document.getElementById('kw-dock-cta');
  var cd   = document.getElementById('kw-dock-countdown');
  var deadline = (window.KW && window.KW.DEADLINE) || new Date('2026-12-21T00:00:00Z');
  var stripe   = (window.KW && window.KW.STRIPE)   || '#order';
  if (cta) cta.href = stripe;

  function tick() {
    var diff = deadline - Date.now();
    if (diff <= 0) { cd.textContent = 'SOLSTICE PASSED'; return; }
    var days = Math.floor(diff / 864e5);
    cd.textContent = days + 'D TO SOLSTICE';
  }
  tick();
  setInterval(tick, 60000);

  var shown = false;
  function check() {
    var past = window.scrollY > 240;
    if (past !== shown) { shown = past; dock.classList.toggle('kw-visible', past); }
  }
  window.addEventListener('scroll', check, { passive: true });
})();
</script>
